name: swarm # Fixed name → network is always "swarm_default"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swarm}
      POSTGRES_DB: swarm
    ports:
      # Host port offset from Postgres' 5432 default so SWARM can run alongside
      # Cascade (and any other local Postgres) without a host-port clash.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Offset from Redis' 6379 default — see the Postgres note above.
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  router:
    build:
      context: .
      dockerfile: Dockerfile.router
    restart: unless-stopped
    ports:
      # Offset from Cascade's router (3000) so both can run at once.
      - "${ROUTER_PORT:-3100}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://swarm:${POSTGRES_PASSWORD:-swarm}@postgres:5432/swarm
      # The compose Postgres serves no TLS; without this, client.ts defaults to
      # rejectUnauthorized:true and the first app-code connection would fail.
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-}
      # Dispatch mode (ADR-003 §2). Default `in-process` leaves the BullMQ consumer
      # on the host worker. Set `SWARM_DISPATCH_MODE=transport` (in `.env`) to run
      # the control-plane dispatcher here: this router dequeues, runs the ADR-001
      # eligibility gate, and pushes a TaskAssignment to the selected connected
      # worker. Every worker runs `npm run dev:worker` (the DB-free transport
      # entrypoint) in that mode — including this host's own, pointed at
      # SWARM_CONTROL_PLANE_URL=http://localhost:${ROUTER_PORT} over loopback. See
      # docs/configuration.md.
      SWARM_DISPATCH_MODE: ${SWARM_DISPATCH_MODE:-in-process}
      # In transport mode the router owns the BullMQ consumer, so it must receive
      # the same dispatch-concurrency setting as the host worker. Without this
      # pass-through it silently uses the resolver's default of one.
      SWARM_WORKER_CONCURRENCY: ${SWARM_WORKER_CONCURRENCY:-1}
      # Worker-local operator GitHub token (issue #396) — OPTIONAL here, unlike on a
      # worker (which throws at startup without it). The router's ONE use of it is
      # POST /worker/delivery/pr-comment with `persona: 'implementer'`: a federated
      # worker's Respond-to-review reply, which must not be authored by the reviewer
      # it answers (issue #444). Unset, the router still starts — it logs a warning —
      # and answers that single route 503; every other route, that route's reviewer
      # persona included, works. It is NOT needed for loop prevention: the board gate
      # resolves the PM provider's own credential (issue #537), comment gates key on
      # SWARM's own marker (issue #443), and persona-identity routing (personaForActor)
      # runs worker-side in the trigger handlers. The API server needs none either
      # since #537 moved board discovery onto the project's PM credential, and since
      # issue #765 no *worker* reads it at all — a worker's operator identity is
      # stored per (worker, SCM provider) and resolved at dispatch. Note this
      # is the *operator's own* account and the router holds one value for every
      # worker it serves, so a multi-operator deployment authors every implementer
      # reply under whichever account it names. Never persisted; passed through from
      # the host env.
      SWARM_OPERATOR_GH_TOKEN: ${SWARM_OPERATOR_GH_TOKEN:-}
      # SWARM's own public base URL (issue #496). The receiver hands each route's
      # callback URL to the PM provider's signature verifier, because some providers
      # sign it with the body (Trello). Unset is fine for GitHub / GitHub Projects:
      # the receiver then derives it from the request's Host header.
      WEBHOOK_CALLBACK_BASE_URL: ${WEBHOOK_CALLBACK_BASE_URL:-}
      # Structured logging (src/lib/logger.ts). Containers have no TTY, so the
      # logger already defaults to JSON here; set these to tune level/format.
      SWARM_LOG_LEVEL: ${SWARM_LOG_LEVEL:-info}
      SWARM_LOG_FORMAT: ${SWARM_LOG_FORMAT:-json}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # The worker is NOT containerized: it provisions Git worktrees and spawns the
  # `claude` / `antigravity` CLIs, which need the developer's own PATH, auth, and
  # config. It runs on the host instead (`npm run dev:worker`), reaching this
  # router over its published host port — the same way a remote worker reaches it
  # through the tunnel. See README "Running the stack" and ai/ARCHITECTURE.md.

  # Opt-in — only starts when the "tunnel" profile is active (set
  # COMPOSE_PROFILES=tunnel in .env). Runs a dashboard-created Cloudflare Tunnel
  # (docs/cloudflare-tunnel.md, Path C) so it starts/stops with the rest of the
  # stack instead of a standalone terminal process. Talks to the router over the
  # compose network by service name — the tunnel's Public Hostname route in the
  # Cloudflare dashboard must point at http://router:3000, NOT localhost.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      router: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
