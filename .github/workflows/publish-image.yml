name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

# Serialised per ref (never cancelled), so :main can't be overwritten by an older
# build that finishes later. During a burst of merges GitHub keeps only the newest
# pending run, so a superseded intermediate commit may get no sha- tag of its own.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :main on a push to main, the tag name verbatim (:v1.2.3) on a v* tag, and
      # :sha-<short> on both. No :latest — servers should pin (docs/MANUAL.md).
      # The generated OCI labels carry the source commit (image.revision).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
